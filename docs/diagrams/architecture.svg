<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0806"/>
      <stop offset="1" stop-color="#14100a"/>
    </linearGradient>
    <style>
      .box { fill: #14100a; stroke: #c9a84c; stroke-width: 1.2; rx: 6; }
      .boxAlt { fill: #1a1508; stroke: #c9a84c; stroke-width: 1; rx: 6; opacity: 0.9; }
      .title { fill: #f0d98c; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
      .label { fill: #e7d6a9; font-size: 12px; }
      .sub { fill: #a99763; font-size: 10.5px; }
      .arrow { stroke: #c9a84c; stroke-width: 1.3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9a84c"/>
    </marker>
  </defs>

  <rect width="980" height="460" fill="url(#bgGrad)"/>
  <text x="490" y="34" text-anchor="middle" class="title" font-size="20">ANAHITA — SYSTEM ARCHITECTURE</text>

  <!-- Source content -->
  <rect x="30" y="70" width="180" height="70" class="box"/>
  <text x="120" y="98" text-anchor="middle" class="label">Extracted Content</text>
  <text x="120" y="116" text-anchor="middle" class="sub">persia.ts / egypt.ts / greek.ts</text>
  <text x="120" y="130" text-anchor="middle" class="sub">Typed PantheonData literals</text>

  <!-- Models -->
  <rect x="270" y="70" width="200" height="130" class="box"/>
  <text x="370" y="96" text-anchor="middle" class="label">Domain Model (OOP)</text>
  <text x="370" y="118" text-anchor="middle" class="sub">class Deity</text>
  <text x="370" y="136" text-anchor="middle" class="sub">class DeityGroupModel</text>
  <text x="370" y="154" text-anchor="middle" class="sub">class Pantheon</text>
  <text x="370" y="172" text-anchor="middle" class="sub">class PantheonRegistry</text>

  <!-- Hooks -->
  <rect x="530" y="70" width="200" height="130" class="boxAlt"/>
  <text x="630" y="96" text-anchor="middle" class="label">React Hooks</text>
  <text x="630" y="118" text-anchor="middle" class="sub">usePantheonExplorer</text>
  <text x="630" y="136" text-anchor="middle" class="sub">useFavorites</text>
  <text x="630" y="154" text-anchor="middle" class="sub">useScrollReveal</text>
  <text x="630" y="172" text-anchor="middle" class="sub">search · filter · random</text>

  <!-- Pages -->
  <rect x="790" y="70" width="160" height="130" class="box"/>
  <text x="870" y="96" text-anchor="middle" class="label">Pages</text>
  <text x="870" y="118" text-anchor="middle" class="sub">Home</text>
  <text x="870" y="136" text-anchor="middle" class="sub">PersiaPage</text>
  <text x="870" y="154" text-anchor="middle" class="sub">EgyptPage</text>
  <text x="870" y="172" text-anchor="middle" class="sub">GreekPage</text>

  <path class="arrow" d="M210,105 H265"/>
  <path class="arrow" d="M470,135 H525"/>
  <path class="arrow" d="M730,135 H785"/>

  <!-- Components row -->
  <rect x="30" y="250" width="920" height="90" class="boxAlt"/>
  <text x="490" y="273" text-anchor="middle" class="label">Shared Components</text>
  <text x="150" y="300" text-anchor="middle" class="sub">DeityCard</text>
  <text x="290" y="300" text-anchor="middle" class="sub">DeityModal</text>
  <text x="430" y="300" text-anchor="middle" class="sub">SearchToolbar</text>
  <text x="570" y="300" text-anchor="middle" class="sub">BackgroundCanvas</text>
  <text x="710" y="300" text-anchor="middle" class="sub">CustomCursor</text>
  <text x="840" y="300" text-anchor="middle" class="sub">Navbar / Footer</text>
  <text x="150" y="320" text-anchor="middle" class="sub">card layout</text>
  <text x="290" y="320" text-anchor="middle" class="sub">detail lightbox</text>
  <text x="430" y="320" text-anchor="middle" class="sub">query + filter</text>
  <text x="570" y="320" text-anchor="middle" class="sub">canvas geometry</text>
  <text x="710" y="320" text-anchor="middle" class="sub">pointer trail</text>
  <text x="840" y="320" text-anchor="middle" class="sub">routing chrome</text>

  <path class="arrow" d="M870,200 V245"/>

  <!-- Build pipeline -->
  <rect x="30" y="380" width="240" height="60" class="box"/>
  <text x="150" y="405" text-anchor="middle" class="label">Vite + TypeScript Build</text>
  <text x="150" y="423" text-anchor="middle" class="sub">tsc -b &amp;&amp; vite build</text>

  <rect x="370" y="380" width="240" height="60" class="box"/>
  <text x="490" y="405" text-anchor="middle" class="label">GitHub Actions CI</text>
  <text x="490" y="423" text-anchor="middle" class="sub">typecheck · lint · build</text>

  <rect x="710" y="380" width="240" height="60" class="box"/>
  <text x="830" y="405" text-anchor="middle" class="label">GitHub Pages</text>
  <text x="830" y="423" text-anchor="middle" class="sub">Static hosting, on push to main</text>

  <path class="arrow" d="M270,410 H365"/>
  <path class="arrow" d="M610,410 H705"/>
</svg>
