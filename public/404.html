<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anahita</title>
    <script>
      // GitHub Pages has no server-side router, so a direct visit to a
      // route like /anahita/persia returns this 404 page instead of
      // index.html. This redirect preserves the intended path as a
      // query string, and main.tsx's history restore below rewrites
      // the URL back before React Router mounts, so deep links and
      // page refreshes both work correctly.
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace("/anahita/?redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
